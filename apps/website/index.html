<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      name="theme-color"
      content="#e5e5e5"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#262626"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      href="/favicon.ico"
      sizes="32x32"
    />
    <link
      rel="icon"
      href="/favicon-light.svg"
      type="image/svg+xml"
      sizes="any"
      media="(prefers-color-scheme: light)"
      data-inspektor-theme-icon="true"
    />
    <link
      rel="icon"
      href="/favicon-dark.svg"
      type="image/svg+xml"
      sizes="any"
      media="(prefers-color-scheme: dark)"
      data-inspektor-theme-icon="true"
    />
    <!-- Keep this Vite-managed source aligned with the Latin @font-face so the browser reuses the preload. -->
    <link
      rel="preload"
      href="/src/assets/instrumentSansLatin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta
      name="description"
      content="Inspect Jazz application data in your browser. Explore schemas and records, edit supported rows, and monitor live queries."
    />
    <link
      rel="canonical"
      href="https://inspektor.dev/"
    />
    <meta
      property="og:type"
      content="website"
    />
    <meta
      property="og:site_name"
      content="Inspektor"
    />
    <meta
      property="og:title"
      content="Inspektor — Inspect Jazz application data in your browser"
    />
    <meta
      property="og:description"
      content="Inspect Jazz application data in your browser. Explore schemas and records, edit supported rows, and monitor live queries."
    />
    <meta
      property="og:url"
      content="https://inspektor.dev/"
    />
    <meta
      name="twitter:card"
      content="summary"
    />
    <meta
      name="twitter:title"
      content="Inspektor — Inspect Jazz application data in your browser"
    />
    <meta
      name="twitter:description"
      content="Inspect Jazz application data in your browser. Explore schemas and records, edit supported rows, and monitor live queries."
    />
    <title>Inspektor — Inspect Jazz application data in your browser</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Inspektor requires JavaScript to run.</noscript>
    <script
      type="module"
      src="/src/app.tsx"
    ></script>
  </body>
</html>
